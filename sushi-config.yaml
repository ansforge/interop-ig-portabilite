# Documentation à propos de cette page : https://fshschool.org/docs/sushi/configuration/

id: ans.fhir.fr.pdlgc
canonical: https://interop.esante.gouv.fr/ig/fhir/pdlgc
name: PDLGC
title: Portabilité des Données LGC
description: Architecture d'archive de portabilité des données LGC
publisher:
  name: Agence du Numérique en Santé (ANS) - 2-10 Rue d'Oradour-sur-Glane, 75015 Paris
  url: https://esante.gouv.fr
status: draft
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2020+
# releaseLabel: trial-use
releaseLabel: draft

jurisdiction: urn:iso:std:iso:3166#FR "France (la)"

dependencies:
  ans.fr.terminologies: latest
  ans.fr.mos: 0.1.0-ballot

parameters: #Parameters list - https://build.fhir.org/ig/FHIR/fhir-tools-ig/CodeSystem-ig-parameters.html
    shownav: 'true'
    path-expansion-params: '../../expansion-params.json' # for using French SNOMED CT Extension
    pin-canonicals: pin-all
    apply-contact: true
    logging:
      - tx #tx: Messages describing the use of the terminology server (for debugging)
      - html #html: Log when validating an html page (troubleshooting only - leave off)
      - generate #generate: Log when producing an individual resource (troubleshooting only - leave off)
      - init #init: Messages describing the start up process (for debugging)
      - progress #progress: Overall progress messages
    i18n-default-lang: fr # Default language
    apply-jurisdiction: true
    i18n-lang:
      - en
    translation-sources:
      - input/translations/en


pages:
    index.md:
        title: Accueil
    specifications.md:
        title: Spécifications
        specs-main-flux-export-archive-portabilite.md :
            title : Flux Export d'Archive de Portabilité
        specs-main-structure-archive.md : 
            title : Structure de l'archive de portabilité
    annexes.md : 
        title : Annexes
        annexe-securite.md:
            title: Sécurité
        annexe-references.md : 
            title : Références
        annexe-downloads.md:
            title: Téléchargements et usages
    change-log.md:
        title: Historique des versions
    autres_ressources.md:
        title: Autres Ressources
    translationinfo.md:
        title: Informations sur la traduction

menu:
    Accueil: index.html
    Spécifications:
        Flux Export d'Archive de Portabilité: specs-main-flux-export-archive-portabilite.html
        Structure de l'architecture de portabilité : specs-main-structure-archive.html
    Annexes:
        Références : annexe-references.html
        Sécurité: annexe-securite.html
        Téléchargements et usage: annexe-downloads.html
        "Site de l'ANS ": new-tab https://esante.gouv.fr/
        Documentation des guides d'implémentation: new-tab https://interop.esante.gouv.fr/ig/documentation/
    Ressources de conformité: artifacts.html
    Historique: change-log.html


groups:
  LogicalModelXDM:
    name:  Modèle logique Metadata XDM (Lot de soumission (SubmissionSet), DocumentEntry (XDS) et association)
    description: Modèles logiques associés aux différents artifacts des METADATA XDS
    resources:
      - StructureDefinition/xdmSubmissionSet
      - StructureDefinition/xdmDocumentEntry
      - StructureDefinition/xdmEventCode
      - StructureDefinition/xdmPatientId
      - StructureDefinition/xdmSourcePatientId
      - StructureDefinition/xdmSourcePatientInfo
      - StructureDefinition/xdmAuthor
      - StructureDefinition/xdmAuthorDocumentEntry
      - StructureDefinition/xdmAuthorSubmissionSet
      - StructureDefinition/xdmAuthorInstitution
      - StructureDefinition/xdmActorXds
      - StructureDefinition/xdmActorPs
      - StructureDefinition/xdmActorPatient
      - StructureDefinition/xdmActorSnr
      - StructureDefinition/xdmActorSystem
      - StructureDefinition/xdmArchive
      - StructureDefinition/xdmAssociation
      - StructureDefinition/xdmIdentifiant   
  LogicalModelArchivePortabilite:
    name:  Modèle logique structure Archive de portabilité
    description: Modèles logiques associés aux différents fichiers et répertoires structurant une archive de portabilité
    resources:
      - StructureDefinition/pdlgcArchivePortabilite 
      - StructureDefinition/pdlgcManifest
      - StructureDefinition/pdlgcFournisseurSortant
      - StructureDefinition/pdlgcContactPortabilite
      - StructureDefinition/pdlgcManifestArchives
      - StructureDefinition/pdlgcSystem
      - StructureDefinition/pdlgcReadme
      - StructureDefinition/pdlgcSignature
      - StructureDefinition/pdlgcDocumentation
      - StructureDefinition/pdlgcArchiveTransverse
      - StructureDefinition/pdlgcArchivePatient
      - StructureDefinition/pdlgcMetadata
      - StructureDefinition/pdlgcIndex
  LogicalModelIdentifiant:
    name:  Identifiants nationaux
    description: Format des identifiants nationaux
    resources:
      - StructureDefinition/patId
      - StructureDefinition/psIdNat
      - StructureDefinition/structIdNat
      - StructureDefinition/systIdNat
      - StructureDefinition/snr
